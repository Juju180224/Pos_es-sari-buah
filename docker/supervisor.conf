[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid

; =========================
; PHP-FPM
; =========================
[program:php-fpm]
command=php-fpm
autostart=true
autorestart=true
priority=10

; =========================
; Nginx
; =========================
[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
priority=20

; =========================
; Laravel Queue Worker
; =========================
[program:queue-worker]
command=php /var/www/artisan queue:work --sleep=3 --tries=3 --timeout=90
autostart=true
autorestart=true
numprocs=1
redirect_stderr=true
stdout_logfile=/var/log/queue.log

; =========================
; Laravel Scheduler
; =========================
[program:scheduler]
command=sh -c "while true; do php /var/www/artisan schedule:run >> /dev/null 2>&1; sleep 60; done"
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/var/log/scheduler.log